services:
  wine_agent:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      WINE_CONFIG_PATH: /config/config.yaml
      WINE_DB_PATH: /data/wine_auctions.db
      WINE_REPORTS_DIR: /data/reports
    volumes:
      # Persistent data (SQLite + generated reports)
      - wine_data:/data
      # Config survives container rebuilds via host bind mount.
      # Edit config.yaml on the host; changes take effect on the next request.
      - ./config.yaml:/config/config.yaml
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      wine_agent:
        condition: service_healthy

volumes:
  wine_data:
