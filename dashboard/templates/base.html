<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Langton's Auction Agent{% endblock %}</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  {% block extra_head %}{% endblock %}
  <style>
    :root { --wine: #8B1A1A; --wine-dark: #5c1010; --sidebar-bg: #1a1a2e; }

    body { background: #f4f4f8; min-height: 100vh; }

    /* Sidebar */
    #sidebar {
      width: 220px; min-height: 100vh; background: var(--sidebar-bg);
      position: fixed; top: 0; left: 0; z-index: 100;
      display: flex; flex-direction: column;
    }
    #sidebar .brand {
      padding: 1.25rem 1rem; background: var(--wine-dark);
      color: #fff; font-weight: 700; font-size: 0.9rem; letter-spacing: 0.04em;
    }
    #sidebar .brand small { display: block; font-weight: 400; opacity: .7; font-size: .75rem; }
    #sidebar .nav-link {
      color: rgba(255,255,255,.7); padding: .6rem 1.25rem;
      font-size: .875rem; border-radius: 0;
    }
    #sidebar .nav-link:hover, #sidebar .nav-link.active {
      color: #fff; background: var(--wine);
    }
    #sidebar .nav-link i { width: 1.25rem; }

    /* Main content */
    #main { margin-left: 220px; padding: 1.75rem; }

    /* Cards */
    .stat-card { border: none; border-radius: .75rem; box-shadow: 0 2px 8px rgba(0,0,0,.07); }
    .stat-card .card-body { padding: 1.25rem 1.5rem; }
    .stat-num { font-size: 2rem; font-weight: 700; color: var(--wine); }

    /* Badges */
    .score-badge {
      font-size: .8rem; padding: .3em .6em; border-radius: .5em;
      font-weight: 600;
    }
    .score-high   { background: #d4edda; color: #155724; }
    .score-medium { background: #fff3cd; color: #856404; }
    .score-low    { background: #f8d7da; color: #721c24; }

    /* Toast */
    .toast-container { position: fixed; bottom: 1.5rem; right: 1.5rem; z-index: 9999; }

    @media (max-width: 768px) {
      #sidebar { width: 100%; min-height: auto; position: relative; }
      #main { margin-left: 0; }
    }
  </style>
</head>
<body>
  <!-- Sidebar -->
  <nav id="sidebar">
    <div class="brand">
      <i class="bi bi-cup-hot-fill me-1" style="color:#c0392b"></i> Langton's Agent
      <small>Auction Intelligence</small>
    </div>
    <ul class="nav flex-column mt-2">
      <li class="nav-item">
        <a class="nav-link {% if request.url.path == '/' %}active{% endif %}" href="/">
          <i class="bi bi-speedometer2"></i> Dashboard
        </a>
      </li>
      <li class="nav-item">
        <a class="nav-link {% if '/upcoming' in request.url.path %}active{% endif %}" href="/upcoming">
          <i class="bi bi-hammer"></i> Upcoming Auction
        </a>
      </li>
      <li class="nav-item">
        <a class="nav-link {% if '/lots' in request.url.path %}active{% endif %}" href="/lots">
          <i class="bi bi-table"></i> Lot Browser
        </a>
      </li>
      <li class="nav-item">
        <a class="nav-link {% if '/reports' in request.url.path %}active{% endif %}" href="/reports">
          <i class="bi bi-file-text"></i> Reports
        </a>
      </li>
      <li class="nav-item mt-auto">
        <a class="nav-link {% if '/strategy' in request.url.path %}active{% endif %}" href="/strategy">
          <i class="bi bi-sliders"></i> Strategy Settings
        </a>
      </li>
    </ul>
  </nav>

  <!-- Main -->
  <div id="main">
    {% block content %}{% endblock %}
  </div>

  <!-- Toast container -->
  <div class="toast-container">
    <div id="actionToast" class="toast align-items-center text-bg-success border-0" role="alert">
      <div class="d-flex">
        <div class="toast-body" id="toastMsg">Done.</div>
        <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  {% block extra_js %}{% endblock %}
  <script>
    function showToast(msg, type='success') {
      const t = document.getElementById('actionToast');
      t.className = `toast align-items-center text-bg-${type} border-0`;
      document.getElementById('toastMsg').textContent = msg;
      new bootstrap.Toast(t, {delay:3500}).show();
    }
    async function apiPost(url, btn) {
      if (btn) btn.disabled = true;
      try {
        const r = await fetch(url, {method:'POST'});
        const d = await r.json();
        showToast(d.message || 'Done.');
      } catch(e) {
        showToast('Error: ' + e.message, 'danger');
      } finally {
        if (btn) { btn.disabled = false; }
      }
    }
  </script>
</body>
</html>
