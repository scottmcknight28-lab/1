# Langton's Wine Auction Agent Configuration
# Edit this file to customise your bidding strategy.

bidding:
  # Bid when the auction estimate is this far below the historical market average (%)
  # e.g. 15 means only bid when estimate is ≥15% below the running average
  value_threshold_pct: 15

  # Absolute cap on any single bid (AUD)
  max_bid_amount: 500

  # Producers to focus on (case-insensitive, partial match).
  # Leave empty to consider all producers.
  preferred_producers:
    - Penfolds
    - Henschke
    - Leeuwin Estate
    - Giaconda
    - Clarendon Hills

  # Regions to focus on (case-insensitive, partial match).
  # Leave empty to consider all regions.
  preferred_regions:
    - Barossa Valley
    - Eden Valley
    - Margaret River
    - Coonawarra
    - Yarra Valley

  # Provenance / condition requirements
  condition_requirements:
    # Minimum acceptable fill level.
    # Options (best → worst): "into neck", "base of neck", "top shoulder",
    #   "upper shoulder", "mid shoulder", "lower shoulder"
    min_fill_level: "top shoulder"

    # Require cellar-stored provenance?
    require_cellar_stored: false

    # Require original carton?
    require_original_carton: false

scraping:
  base_url: "https://www.langtons.com.au"

  # Politeness delay between HTTP requests (seconds)
  delay_seconds: 2.0

  # Maximum pages to scrape per auction (0 = unlimited)
  max_pages_per_auction: 10

database:
  path: "wine_auction.db"

schedule:
  # Timezone for all schedule times (IANA name)
  timezone: "Australia/Sydney"

  # Auction close times (24h format, local timezone above)
  # Langton's typically closes Tuesday and Sunday evenings
  tuesday_close:  "20:00"
  sunday_close:   "20:00"

  # How many hours before close to send the pre-auction report
  pre_auction_hours: 24

  # How many hours after close to run the post-auction results scrape
  post_auction_hours: 2

  # Where to write report files (directory, created if missing)
  reports_dir: "reports"

  # Optional: email reports  (leave smtp_host blank to disable)
  email:
    smtp_host: ""
    smtp_port: 587
    smtp_user: ""
    smtp_password: ""
    from_addr: ""
    to_addrs: []
